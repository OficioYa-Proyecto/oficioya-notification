name: Debug Notification logs
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read recent App Service logs
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"])
          profile = root.find(".//publishProfile")
          host = profile.get("publishUrl").split(":")[0]
          auth = base64.b64encode((profile.get("userName") + ":" + profile.get("userPWD")).encode()).decode()
          headers = {"Authorization": "Basic " + auth}
          root_url = "https://" + host + "/api/vfs/"
          for folder in ["LogFiles", "LogFiles/Application"]:
              base = root_url + folder + "/"
              listing = json.loads(urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30).read().decode("utf-8", "replace"))
              print("FOLDER", folder, [(x["name"], x["size"], x["mtime"]) for x in listing])
              for item in listing:
                  name = item["name"]
                  if not name.endswith(".log"):
                      continue
                  print("=== " + folder + "/" + name + " ===")
                  text = urllib.request.urlopen(urllib.request.Request(base + name, headers=headers), timeout=30).read().decode("utf-8", "replace")
                  for line in text.splitlines()[-120:]:
                      print(line[:500])
          PY
