name: Debug Notification
on:
  workflow_dispatch:
    inputs:
      tail:
        description: 'Number of log lines to read'
        required: false
        default: '500'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Read Azure logs
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          TAIL: ${{ inputs.tail }}
        run: |
          python3 - <<'PY'
          import base64, os, urllib.request, urllib.error, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"])
          p = root.find(".//publishProfile")
          host = p.get("publishUrl").split(":")[0]
          auth = base64.b64encode((p.get("userName") + ":" + p.get("userPWD")).encode()).decode()
          tail = os.environ.get("TAIL", "500")
          def get(url):
              try:
                  req = urllib.request.Request(url, headers={"Authorization": "Basic " + auth, "Accept": "text/plain"})
                  r = urllib.request.urlopen(req, timeout=60)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, str(e)
          for path in ("/api/logs?tail=" + tail, "/api/logs"):
              code, text = get("https://" + host + path)
              print("ENDPOINT", path, "CODE", code, "LEN", len(text))
              print("RAW", repr(text[-8000:]))
          PY
