name: Debug Notification
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Read Azure application log
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"])
          p = root.find(".//publishProfile")
          host = p.get("publishUrl").split(":")[0]
          auth = base64.b64encode((p.get("userName") + ":" + p.get("userPWD")).encode()).decode()
          def get(path, accept="text/plain", timeout=60):
              req = urllib.request.Request("https://" + host + path, headers={"Authorization": "Basic " + auth, "Accept": accept})
              try:
                  r = urllib.request.urlopen(req, timeout=timeout)
                  return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return -1, str(e)
          code, listing = get("/api/vfs/LogFiles/Application/", "application/json")
          print("LIST CODE", code, "LEN", len(listing))
          files = json.loads(listing) if code == 200 else []
          logs = [f for f in files if f.get("name", "").endswith(".log")]
          logs.sort(key=lambda f: f.get("mtime", ""), reverse=True)
          if logs:
              name = logs[0]["name"]
              code, text = get("/api/vfs/LogFiles/Application/" + name)
              print("LOG", name, "CODE", code, "LEN", len(text))
              print("TAIL", repr(text[-24000:]))
          else:
              print("NO LOG FILE")
          PY
