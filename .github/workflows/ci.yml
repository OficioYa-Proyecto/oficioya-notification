name: CI/CD - OficioYa Notification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Inject mail and Firebase configuration for Azure
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFICATION_FALLBACK_EMAIL: ${{ secrets.NOTIFICATION_FALLBACK_EMAIL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > src/main/resources/firebase-service-account.json
          {
            printf '\nnotification.smtp.host=%s\n' "$MAIL_HOST"
            printf 'notification.smtp.port=%s\n' "$MAIL_PORT"
            printf 'notification.smtp.username=%s\n' "$MAIL_USERNAME"
            printf 'notification.smtp.password=%s\n' "$MAIL_PASSWORD"
            printf 'notification.admin.email=%s\n' "$NOTIFICATION_FALLBACK_EMAIL"
            printf 'firebase.credentials.path=classpath:firebase-service-account.json\n'
            printf 'firebase.project.id=%s\n' "$FIREBASE_PROJECT_ID"
          } >> src/main/resources/application-azure.properties
          # Azure tiene SPRING_PROFILES_ACTIVE=prod en el App Service real, así que
          # las claves propias también deben quedar en el archivo base.
          {
            printf '\nnotification.smtp.host=%s\n' "$MAIL_HOST"
            printf 'notification.smtp.port=%s\n' "$MAIL_PORT"
            printf 'notification.smtp.username=%s\n' "$MAIL_USERNAME"
            printf 'notification.smtp.password=%s\n' "$MAIL_PASSWORD"
            printf 'notification.admin.email=%s\n' "$NOTIFICATION_FALLBACK_EMAIL"
            printf 'firebase.credentials.path=classpath:firebase-service-account.json\n'
            printf 'firebase.project.id=%s\n' "$FIREBASE_PROJECT_ID"
          } >> src/main/resources/application.properties

      - name: Build and test with Maven
        run: mvn -B clean verify -Dtest='!OficioyaNotificationApplicationTests' -DfailIfNoTests=false -Djacoco.skip=true

      - name: Upload JAR artifact
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '**/target/oficioya-notification-*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oficioya-notificationapi'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '**/oficioya-notification-*.jar'
          restart: 'true'