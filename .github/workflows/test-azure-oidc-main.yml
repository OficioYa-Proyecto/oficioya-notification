name: Test Azure OIDC
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8FF236D27FFE49539384C3EAAAA3CD95 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_60E692670AEE4FFA8B9ACA7DC6355BE4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_79EB9130D6504FF2AEF425312520A8B5 }}
      - run: az account show --query name -o tsv
      - run: az webapp list --query "[].{name:name,rg:resourceGroup,location:location}" -o table
