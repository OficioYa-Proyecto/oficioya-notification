# Perfil autocontenido para despliegue F1 en Azure (costo cero)
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:/home/data/oficioyanotif;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/oficioyaNotification}
spring.data.mongodb.auto-index-creation=false

# Firebase: la ruta se inyecta en el build desde el secreto FIREBASE_CREDENTIALS_JSON.
# Si no hay credenciales, FcmService deja el envío FCM deshabilitado sin fallar el arranque.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project.id=${FIREBASE_PROJECT_ID:oficio-ya-b7232}

app.jwt.secret=${JWT_SECRET:oficioya-notification-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya

# SMTP con claves propias: evita que App Settings heredadas (MAIL_USERNAME/MAIL_PASSWORD)
# sobrescriban las credenciales inyectadas durante el build.
notification.smtp.host=${NOTIFICATION_SMTP_HOST:smtp.gmail.com}
notification.smtp.port=${NOTIFICATION_SMTP_PORT:587}
notification.smtp.username=${NOTIFICATION_SMTP_USERNAME:}
notification.smtp.password=${NOTIFICATION_SMTP_PASSWORD:}

notification.admin.email=${NOTIFICATION_ADMIN_EMAIL:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
