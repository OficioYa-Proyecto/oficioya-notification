# Perfil autocontenido para despliegue F1 en Azure (costo cero)
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:/home/data/oficioyanotif;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Evita que Hibernate cree columnas ENUM con valores fijos: nuevos tipos deben poderse insertar.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

spring.flyway.enabled=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/oficioyaNotification}
spring.data.mongodb.auto-index-creation=false

# Firebase desactivado: sin ruta de credenciales el envio FCM queda deshabilitado
firebase.credentials.path=
firebase.project.id=${FIREBASE_PROJECT_ID:oficio-ya-b7232}

app.jwt.secret=${JWT_SECRET:oficioya-notification-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya

notification.admin.email=${NOTIFICATION_ADMIN_EMAIL:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
