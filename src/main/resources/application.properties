spring.application.name=oficioya-notification
spring.profiles.default=dev
server.port=${SERVER_PORT:8082}

# Firebase Cloud Messaging (opcional; si no se configura, el envío FCM se deshabilita)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:Firebase/service-account.json}
firebase.project.id=${FIREBASE_PROJECT_ID:oficio-ya-b7232}

# Email (notificaciones al administrador)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.admin.email=${NOTIFICATION_ADMIN_EMAIL:}

# Destinatario de los avisos cuando falla el envío por SMTP o FCM.
notification.fallback.email=${NOTIFICATION_FALLBACK_EMAIL:${NOTIFICATION_ADMIN_EMAIL:juanjorivlou@gmail.com}}

# Secreto JWT (mismo valor que Identity y el orquestador). Sin valor por defecto: si falta, Notification rechaza todos los tokens.
app.jwt.secret=${JWT_SECRET:}
